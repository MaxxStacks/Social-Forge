name: Browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run interactive storefront checks
        run: node scripts/browser-qa.mjs
      - name: Store renders and QA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socialforge-browser-qa
          path: qa/
          retention-days: 7
